name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.20.0 --activate

      - name: Confirm toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare CI environment
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "SQLITE_DATABASE_PATH=$RUNNER_TEMP/bdt-booking-ci.sqlite" >> "$GITHUB_ENV"

      - name: Verify repository
        run: pnpm verify
